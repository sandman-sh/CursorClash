[package]
name = "cursorclash"
version = "0.1.0"
description = "CursorClash: Real-time Multiplayer Canvas Tap-Trading with MagicBlock Ephemeral Rollups"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "cursorclash"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "=0.30.1", features = ["init-if-needed"] }
anchor-spl = "=0.30.1"
ephemeral-rollups-sdk = { version = "0.4.0", features = ["anchor"] }
digest = "=0.10.7"
blake3 = "=1.5.5"
generic-array = "=0.14.7"
zeroize = "=1.3.0"
zeroize_derive = "=1.3.3"
toml_datetime = "=0.6.8"
indexmap = "=2.6.0"
proc-macro-crate = "=3.1.0"
borsh = "=1.5.7"
borsh-derive = "=1.5.7"
unicode-segmentation = "=1.11.0"
solana-program-error = "=2.2.2"
jobserver = "=0.1.32"
