<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Neo-brutalist solid black shadow -->
  <rect x="8" y="8" width="48" height="48" fill="#000000" rx="4" />
  <!-- Main container with neon light green fill and bold black border -->
  <rect x="4" y="4" width="48" height="48" fill="#00FF66" stroke="#000000" stroke-width="3" rx="4" />
  
  <!-- Candlestick Wick & Body in background -->
  <!-- Top Wick -->
  <line x1="20" y1="12" x2="20" y2="18" stroke="#000000" stroke-width="2.5" stroke-linecap="square" />
  <!-- Candle Body -->
  <rect x="16" y="18" width="8" height="18" fill="#000000" stroke="#000000" stroke-width="1.5" />
  <!-- Bottom Wick -->
  <line x1="20" y1="36" x2="20" y2="44" stroke="#000000" stroke-width="2.5" stroke-linecap="square" />

  <!-- The Cursor Arrow & Crosshair Clashing on the wick -->
  <path d="M22 20 L40 32 L31 34 L36 44 L30 46 L25 36 L20 40 Z" fill="#000000" stroke="#FFFFFF" stroke-width="1.5" stroke-linejoin="miter" />
  
  <!-- Clash Spark / Flash Star in Neon Green / White -->
  <path d="M22 17 L24 21 L28 22 L24 23 L22 27 L20 23 L16 22 L20 21 Z" fill="#FFFFFF" stroke="#000000" stroke-width="1" />
</svg>